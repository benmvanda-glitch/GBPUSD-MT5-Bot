name: GBPUSD Bot

name: GBPUSD Bot

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile MQL5
        uses: fx31337/mql-compile-action@v2
        with:
          path: GBPUSD_Bot.mq5
          include: .
          init-platform: true
          mt-version: 5.0.0.2515
          verbose: true

      - name: List compiled files
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.ex5

      - name: Upload EX5
        uses: actions/upload-artifact@v4
        with:
          name: GBPUSD_Bot_EX5
          path: '**/*.ex5'
          if-no-files-found: error
