name: GBPUSD Bot

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile MQL5
        uses: fx31337/mql-compile-action@master
        with:
          include: .
          init-platform: true
          mt-version: 5.0.0.2515
          path: GBPUSD_Bot.mq5
          verbose: true

      - name: List compiled files
        shell: powershell
        run: Get-ChildItem -Recurse -Filter *.ex5
